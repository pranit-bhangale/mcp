spring:
  application:
    name: mcp-client
  # AI Configuration
  ai:
    chat:
      client:
        enabled: true
    openai:
      api-key: ${CHAT_KEY}
      base-url: ${CHAT_BASE_URL}
      chat:
        model: ${CHAT_MODEL}
        temperature: 0.2
        max-completion-tokens: 2048
      timeout: 120s
